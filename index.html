<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Planear es anticiparse al futuro</title>
    <style>
      :root {
        --paper: #f5f1e8;
        --ink: #153b48;
        --accent: #b84d36;
        --green: #28786e;
        --soft: #e6e2d8;
        --muted: #50646a;
        --line: #c7d0cd;
        --white: #fffdf8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          18px/1.48 Arial,
          Helvetica,
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 4px;
      }
      button {
        border: 1px solid var(--line);
        border-radius: 4px;
        background: transparent;
        color: var(--ink);
        padding: 10px 17px;
      }
      button:hover {
        background: #e4e9e5;
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      button.primary {
        background: var(--ink);
        color: var(--white);
        border-color: var(--ink);
      }
      button.primary:hover {
        background: #235362;
      }
      button.active,
      button[aria-selected="true"] {
        background: var(--ink);
        color: var(--white);
        border-color: var(--ink);
      }
      a {
        color: var(--ink);
        text-underline-offset: 3px;
      }
      p {
        margin: 0 0 16px;
      }
      h1,
      h2,
      h3 {
        line-height: 1.13;
        margin: 0 0 22px;
        font-weight: 600;
      }
      h1,
      h2 {
        font-family: Georgia, "Times New Roman", serif;
      }
      h1 {
        font-size: clamp(45px, 6vw, 80px);
        letter-spacing: -2.7px;
      }
      h2 {
        font-size: clamp(32px, 3.5vw, 48px);
        letter-spacing: -1.25px;
      }
      h3 {
        font-size: 24px;
      }
      strong {
        font-weight: 700;
      }
      .small {
        font-size: 15px;
        line-height: 1.45;
      }
      .muted {
        color: var(--muted);
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 2.5px;
        font-size: 13px;
        font-weight: 700;
        color: var(--accent);
        margin: 0 0 20px;
      }
      .lead {
        font-size: 22px;
        line-height: 1.5;
        max-width: 850px;
      }
      .source {
        font-size: 13px;
        color: var(--muted);
        margin-top: 22px;
        line-height: 1.5;
      }
      .source a {
        color: inherit;
      }
      .tag {
        display: inline-block;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 20px;
        color: var(--muted);
      }
      header {
        height: 66px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 4vw;
        border-bottom: 1px solid var(--line);
        gap: 20px;
      }
      header .brand {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.8px;
      }
      header .tools {
        display: flex;
        gap: 8px;
      }
      header button {
        font-size: 13px;
        padding: 7px 12px;
      }
      .progress {
        height: 3px;
        background: var(--soft);
      }
      #progress {
        height: 100%;
        background: var(--accent);
        width: 0;
        transition: width 0.4s;
      }
      main {
        max-width: 1420px;
        margin: auto;
        padding: 38px 5vw 30px;
        min-height: calc(100vh - 141px);
      }
      .slide {
        animation: enter 0.45s ease both;
      }
      .split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 52px;
        align-items: start;
      }
      .split.wide-left {
        grid-template-columns: 1.15fr 0.85fr;
      }
      .hero {
        display: grid;
        grid-template-columns: 1.35fr 0.65fr;
        gap: 55px;
        align-items: center;
        min-height: 480px;
      }
      .hero h1 {
        max-width: 850px;
      }
      .hero .deck-meta {
        margin-top: 28px;
        font-size: 15px;
        color: var(--muted);
      }
      .hero-steps {
        border-left: 1px solid var(--line);
        padding-left: 36px;
      }
      .hero-step {
        padding: 23px 0;
        border-bottom: 1px solid var(--line);
        animation: enter 0.7s both;
      }
      .hero-step:nth-child(2) {
        animation-delay: 0.15s;
      }
      .hero-step:nth-child(3) {
        animation-delay: 0.3s;
      }
      .hero-step b {
        display: block;
        font-size: 22px;
      }
      .hero-step span {
        display: block;
        color: var(--muted);
        font-size: 16px;
        margin-top: 5px;
      }
      .hero-step em {
        font-size: 40px;
        color: var(--accent);
        font-family: Georgia, serif;
        font-style: normal;
        float: right;
      }
      .route {
        display: grid;
        gap: 0;
      }
      .route button {
        border: 0;
        border-bottom: 1px solid var(--line);
        text-align: left;
        padding: 20px 0;
        display: grid;
        grid-template-columns: 70px 1fr;
        gap: 20px;
        border-radius: 0;
      }
      .route button:hover {
        background: transparent;
        color: var(--accent);
      }
      .route .num {
        font:
          42px Georgia,
          serif;
        color: var(--accent);
      }
      .route b {
        font-size: 23px;
        display: block;
        margin-bottom: 7px;
      }
      .route small {
        font-size: 17px;
        line-height: 1.4;
        display: block;
        max-width: 890px;
      }
      .callout {
        border-left: 4px solid var(--accent);
        padding: 7px 0 7px 22px;
        margin-top: 24px;
      }
      .callout p {
        margin: 0;
      }
      .flat-list {
        display: grid;
        gap: 22px;
      }
      .flat-list h3 {
        margin-bottom: 7px;
      }
      .number {
        font:
          50px Georgia,
          serif;
        color: var(--accent);
      }
      .chain {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
        margin: 25px 0;
      }
      .chain button {
        position: relative;
        min-height: 108px;
        border: 0;
        border-bottom: 3px solid var(--line);
        border-radius: 0;
        text-align: left;
        padding: 16px 8px;
      }
      .chain button.active {
        background: transparent;
        color: var(--ink);
        border-color: var(--accent);
      }
      .chain button span {
        display: block;
        font-size: 13px;
        color: var(--accent);
        margin-bottom: 10px;
      }
      .chain button b {
        font-size: 20px;
      }
      .reveal {
        min-height: 130px;
        border-top: 1px solid var(--line);
        padding-top: 24px;
      }
      .reveal h3 {
        margin-bottom: 12px;
      }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 20px 0 27px;
      }
      .tabs button {
        font-size: 16px;
      }
      .case-grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 46px;
      }
      .case-grid .declaration {
        display: grid;
        gap: 17px;
      }
      .declaration b {
        display: block;
        font-size: 15px;
        color: var(--accent);
        margin-bottom: 4px;
      }
      .declaration p {
        margin: 0;
        font-size: 18px;
      }
      .case-grid aside {
        border-left: 1px solid var(--line);
        padding-left: 30px;
      }
      .case-grid aside h3 {
        font-size: 25px;
      }
      .case-grid aside .small {
        font-size: 14px;
      }
      .bars {
        margin: 24px 0;
      }
      .barrow {
        margin: 22px 0;
      }
      .barlabel {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
        font-size: 16px;
      }
      .barlabel b {
        font-size: 24px;
      }
      .track {
        height: 34px;
        background: #dedfd7;
        overflow: hidden;
      }
      .bar {
        height: 100%;
        width: var(--value);
        background: var(--green);
        transform-origin: left;
        animation: grow 0.85s ease both;
      }
      .bar.target {
        background: var(--accent);
      }
      .axis {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: var(--muted);
        border-top: 1px solid var(--line);
        padding-top: 6px;
      }
      .stat {
        font:
          72px/1 Georgia,
          serif;
        letter-spacing: -3px;
        color: var(--accent);
        margin-bottom: 8px;
      }
      .label {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1.1px;
        color: var(--muted);
      }
      .detail-toggle {
        font-size: 14px;
        padding: 8px 12px;
        margin-top: 8px;
      }
      details {
        border-bottom: 1px solid var(--line);
        padding: 12px 0;
        font-size: 16px;
      }
      summary {
        cursor: pointer;
        font-weight: bold;
        list-style-position: outside;
        margin-left: 20px;
      }
      details p {
        margin: 10px 0 4px 20px;
      }
      details[open] summary {
        color: var(--accent);
      }
      .tool-layout {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 48px;
      }
      .tool-menu {
        display: grid;
        gap: 8px;
      }
      .tool-menu button {
        text-align: left;
        font-size: 17px;
      }
      .tool-detail {
        padding: 8px 0;
      }
      .tool-detail h3 {
        font:
          32px Georgia,
          serif;
      }
      .tool-detail .number {
        font-size: 64px;
      }
      .tool-detail p {
        max-width: 750px;
      }
      .phase-row {
        display: flex;
        gap: 20px;
        margin-top: 28px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        font-size: 15px;
      }
      .phase-row b {
        color: var(--accent);
      }
      .matrix {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .matrix button {
        text-align: left;
        padding: 18px;
        border: 1px solid var(--line);
        min-height: 148px;
      }
      .matrix button strong {
        font:
          32px Georgia,
          serif;
        color: var(--accent);
        display: block;
      }
      .matrix button.active strong {
        color: #efc6a3;
      }
      .matrix button b {
        display: block;
        margin: 3px 0 8px;
      }
      .matrix button small {
        display: block;
        font-size: 15px;
        line-height: 1.4;
      }
      .strategy-output {
        background: var(--ink);
        color: var(--white);
        padding: 30px;
        min-height: 200px;
      }
      .strategy-output h3 {
        font:
          29px Georgia,
          serif;
      }
      .strategy-output p {
        font-size: 21px;
      }
      .strategy-output .eyebrow {
        color: #efc6a3;
      }
      .scenario-controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 24px 0;
      }
      .scenario-detail {
        display: grid;
        grid-template-columns: 0.65fr 1.35fr;
        gap: 40px;
        border-top: 1px solid var(--line);
        padding-top: 28px;
      }
      .signal {
        font:
          44px/1.12 Georgia,
          serif;
        color: var(--accent);
      }
      .scenario-detail .flat-list {
        gap: 18px;
      }
      .scenario-detail h3 {
        font-size: 19px;
        margin-bottom: 6px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 17px;
      }
      th {
        text-align: left;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--muted);
        border-bottom: 2px solid var(--ink);
        padding: 12px 7px;
      }
      td {
        padding: 14px 7px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      td.num,
      th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .weights {
        display: grid;
        grid-template-columns: 35fr 30fr 20fr 15fr;
        gap: 4px;
        margin: 24px 0 8px;
      }
      .weights div {
        padding: 12px 10px;
        background: var(--ink);
        color: var(--white);
        min-width: 0;
      }
      .weights div:nth-child(2) {
        background: #31616a;
      }
      .weights div:nth-child(3) {
        background: #477b7f;
      }
      .weights div:nth-child(4) {
        background: #5b8586;
      }
      .weights strong {
        font-size: 29px;
        display: block;
      }
      .weights span {
        font-size: 13px;
      }
      .formula {
        font:
          22px Georgia,
          serif;
        margin: 20px 0;
      }
      .scorecell {
        font-weight: 700;
        color: var(--accent);
      }
      .simulator {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 45px;
      }
      .budget-control label {
        display: block;
        font-size: 15px;
      }
      .budget-control output {
        display: block;
        font:
          54px/1.1 Georgia,
          serif;
        margin: 6px 0 14px;
        color: var(--accent);
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
        height: 30px;
        cursor: pointer;
      }
      .range-labels {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: var(--muted);
      }
      .cost-row {
        display: grid;
        grid-template-columns: 24px 1fr 70px;
        gap: 10px;
        align-items: center;
        margin: 15px 0;
        font-size: 14px;
      }
      .cost-row .track {
        height: 22px;
      }
      .cost-row .bar {
        background: #b9c6c1;
        animation: none;
        transition: background 0.4s;
      }
      .cost-row.selected .bar {
        background: var(--green);
      }
      .cost-row.selected strong {
        color: var(--green);
      }
      .selection {
        border-left: 1px solid var(--line);
        padding-left: 32px;
      }
      .selection h3 {
        font:
          36px Georgia,
          serif;
        margin-bottom: 16px;
      }
      .selection .chosen {
        font-size: 21px;
      }
      .totals {
        display: flex;
        gap: 35px;
        margin: 22px 0;
      }
      .totals strong {
        display: block;
        font:
          38px Georgia,
          serif;
        color: var(--accent);
      }
      .totals span {
        font-size: 14px;
        color: var(--muted);
      }
      .cost-name {
        font-size: 13px;
      }
      .notice {
        font-size: 14px;
        background: #e9e5d9;
        padding: 12px 16px;
        margin-top: 18px;
      }
      .timeline {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 24px;
        margin: 30px 0;
      }
      .timeline > div {
        border-top: 3px solid var(--green);
        padding-top: 18px;
      }
      .timeline h3 {
        font-size: 20px;
      }
      .timeline .owner {
        font-size: 14px;
        color: var(--muted);
      }
      .timeline p {
        font-size: 17px;
      }
      .monitor {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 45px;
        border-top: 1px solid var(--line);
        padding-top: 20px;
      }
      .quiz-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 45px;
      }
      .quiz-question {
        font:
          31px/1.25 Georgia,
          serif;
      }
      .answers {
        display: grid;
        gap: 12px;
      }
      .answers button {
        text-align: left;
        display: grid;
        grid-template-columns: 25px 1fr;
        gap: 10px;
        padding: 17px;
        font-size: 17px;
      }
      .answers button.correct {
        background: #e1eee6;
        border-color: var(--green);
      }
      .answers button.incorrect {
        background: #f5ded7;
        border-color: var(--accent);
      }
      .feedback {
        min-height: 104px;
        margin-top: 18px;
        font-size: 17px;
      }
      .quiz-nav {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      .quiz-nav button {
        padding: 7px 13px;
        font-size: 14px;
      }
      .refs {
        display: grid;
        gap: 19px;
        max-width: 1100px;
      }
      .ref {
        font-size: 17px;
        padding-left: 25px;
        text-indent: -25px;
        margin: 0;
      }
      .ref a {
        display: block;
        font-size: 13px;
        overflow-wrap: anywhere;
        margin-top: 3px;
        text-indent: 0;
      }
      .closing {
        max-width: 1000px;
      }
      .closing .lead {
        font-size: 25px;
      }
      .reflection {
        font:
          32px/1.3 Georgia,
          serif;
        color: var(--accent);
        margin-top: 35px;
      }
      .note-list {
        display: grid;
        gap: 22px;
        max-width: 1100px;
      }
      .note-list p {
        font-size: 18px;
      }
      .note-list strong {
        color: var(--accent);
      }
      footer {
        height: 72px;
        border-top: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 4vw;
        gap: 20px;
      }
      footer .nav {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      footer .count {
        font-size: 14px;
        color: var(--muted);
        min-width: 66px;
        text-align: center;
      }
      footer button {
        font-size: 14px;
        padding: 9px 15px;
      }
      #sectionLabel {
        font-size: 14px;
        color: var(--muted);
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
        color: var(--ink);
        padding: 30px;
        max-width: 920px;
        width: 90%;
        max-height: 85vh;
      }
      dialog::backdrop {
        background: #09283299;
      }
      .dialog-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .dialog-head h3 {
        margin: 0;
        font:
          30px Georgia,
          serif;
      }
      .dialog-head button {
        font-size: 14px;
      }
      .index-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .index-grid button {
        text-align: left;
        font-size: 15px;
        padding: 11px 13px;
      }
      .index-grid span {
        color: var(--accent);
        display: inline-block;
        width: 30px;
      }
      #notesBody p {
        font-size: 19px;
        line-height: 1.65;
      }
      #notesBody .source {
        font-size: 14px;
      }
      .quiet {
        animation: none !important;
        transition: none !important;
      }
      .no-motion * {
        animation: none !important;
        transition: none !important;
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes grow {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
      @media (max-width: 850px) {
        body {
          font-size: 17px;
        }
        header {
          padding: 0 20px;
        }
        .brand {
          max-width: 150px;
        }
        .hide-small {
          display: none;
        }
        main {
          padding: 28px 24px;
          min-height: calc(100vh - 141px);
        }
        h1 {
          letter-spacing: -1.6px;
        }
        .hero,
        .split,
        .case-grid,
        .simulator,
        .quiz-grid,
        .scenario-detail,
        .monitor {
          grid-template-columns: 1fr;
          gap: 28px;
        }
        .hero {
          min-height: 0;
        }
        .hero-steps {
          display: flex;
          gap: 20px;
          border-left: 0;
          border-top: 1px solid var(--line);
          padding: 0;
        }
        .hero-step {
          flex: 1;
        }
        .hero-step em {
          float: none;
          font-size: 30px;
        }
        .hero-step b {
          font-size: 17px;
        }
        .hero-step span {
          font-size: 14px;
        }
        .chain {
          grid-template-columns: repeat(5, 1fr);
          gap: 4px;
        }
        .chain button {
          padding: 8px 2px;
          min-height: 88px;
        }
        .chain button b {
          font-size: 14px;
        }
        .case-grid aside,
        .selection {
          padding: 20px 0 0;
          border-left: 0;
          border-top: 1px solid var(--line);
        }
        .tool-layout {
          grid-template-columns: 1fr;
          gap: 20px;
        }
        .tool-menu {
          grid-template-columns: 1fr 1fr;
        }
        .tool-menu button {

                "Tres decisiones para comprobar lo aprendido",
              ) +
              `<div class="quiz-nav">${D.quizzes.map((x, i) => `<button data-quiz="${i}" class="${state.quiz === i ? "active" : ""}">Pregunta ${i + 1}${state.answers[i] !== null ? " ✓" : ""}</button>`).join("")}</div><div class="quiz-grid"><div class="quiz-question">${q.q}</div><div><div class="answers">${q.answers.map((a, i) => `<button data-answer="${i}" aria-pressed="${selected === i}" class="${selected === i ? (i === q.correct ? "correct" : "incorrect") : ""}"><b>${String.fromCharCode(65 + i)}</b><span>${a}</span></button>`).join("")}</div><div class="feedback" aria-live="polite">${selected === null ? "Selecciona una respuesta para contrastar tu decisión." : `<b>${selected === q.correct ? "La decisión tiene fundamento." : "Conviene revisar esa decisión."}</b><p>${q.feedback}</p>`}</div></div></div>`
            );
          },
          notes:
            "La actividad busca explicar la decisión, no memorizar un término. Después de responder, podemos discutir qué evidencia haría cambiar la respuesta en una organización real.",
        },
        {
          title: "La planeación se demuestra en la práctica",
          section: "Reflexión de cierre",
          render: () =>
            heading(
              "Reflexión de cierre",
              "La planeación se demuestra en la práctica",
            ) +
            `<div class="closing"><p class="lead">${D.closing}</p><p class="reflection">${D.reflection}</p><div class="tabs"><button data-go="3">Revisar el objetivo</button><button data-go="8">Volver a la DOFA</button><button data-go="13">Probar otro presupuesto</button></div></div>`,
          notes:
            "La reflexión reúne las tres preguntas. El propósito se vuelve verificable mediante objetivos. El diagnóstico fundamenta alternativas. Las restricciones obligan a justificar la selección. La revisión sostiene la coherencia entre la intención y la práctica.",
        },
        ...[0, 1, 2].map((part) => ({
          title: `Referencias APA 7 · ${part + 1} de 3`,
          section: "Fuentes consultadas",
          render: () =>
            heading(
              "Referencias · APA séptima edición",
              `Fuentes consultadas ${part + 1} / 3`,
            ) +
            `<div class="refs">${D.refs
              .slice(part * 4, part * 4 + 4)
              .map(
                (r) =>
                  `<p class="ref">${r.author} (${r.date}). ${apaTitle(r.title)}. ${r.publisher}<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.url)}</a></p>`,
              )
              .join("")}</div>`,
          notes:
            "Las referencias corresponden a las fuentes efectivamente consultadas. Las páginas sin fecha usan «s. f.». Las letras a y b distinguen obras del mismo autor y sin fecha, ordenadas por título.",
        })),
      ];
      function num(v) {
        return v.toFixed(2).replace(".", ",");
      }
      function solve(budget) {
        let best = { cost: 0, score: 0, items: [] };
        for (let mask = 0; mask < 1 << D.projects.length; mask++) {
          const items = D.projects.filter((p, i) => mask & (1 << i));
          if (items.length > 2) continue;
          const cost = items.reduce((a, p) => a + p.cost, 0),
            score = items.reduce((a, p) => a + p.total, 0);
          if (
            cost <= budget &&
            (score > best.score + 1e-8 ||
              (Math.abs(score - best.score) < 1e-8 && cost < best.cost))
          )
            best = { cost, score, items };
        }
        return best;
      }
      function updateBudget() {
        const b = state.budget,
          best = solve(b);
        $("budgetValue").textContent = `COP ${b} millones`;
        $("budget").setAttribute(
          "aria-valuetext",
          `${b} millones de pesos colombianos`,
        );
        $("costBars").innerHTML = D.projects
          .map(
            (p) =>
              `<div class="cost-row ${best.items.includes(p) ? "selected" : ""}"><strong>${p.id}</strong><div><div class="cost-name">${p.name}</div><div class="track"><div class="bar" style="--value:${(p.cost / 80) * 100}%"></div></div></div><span>COP ${p.cost} M</span></div>`,
          )
          .join("");
        $("selection").innerHTML =
          `<span class="tag">Combinación que elige el modelo</span><h3>${best.items.map((p) => p.id).join(" + ") || "Sin selección"}</h3><p class="chosen">${best.items.map((p) => p.name).join(" y ")}</p><div class="totals"><div><strong>${best.cost}</strong><span>millones usados</span></div><div><strong>${b - best.cost}</strong><span>millones disponibles</span></div><div><strong>${num(best.score)}</strong><span>puntos conjuntos</span></div></div><p>${b < 70 ? "C tiene el puntaje individual más alto, pero sus 70 millones superan este presupuesto." : b === 90 ? "B y C caben exactamente. Su suma supera por 0,10 puntos a A y B. Esa diferencia exige revisar la calidad de las valoraciones." : b >= 100 ? "A y C ofrecen la mayor suma entre las combinaciones elegibles. El límite de dos iniciativas sigue activo." : "A y B tienen mayor puntaje conjunto que C por sí sola."}</p><p class="small muted">Los puntos representan preferencias dentro del ejercicio. No son beneficios financieros ni probabilidades de éxito.</p>`;
      }
      function draw(focus = false) {
        const s = slides[state.slide];
        $("main").innerHTML =
          `<section class="slide" aria-label="${esc(s.title)}">${s.render()}</section>`;
        $("sectionLabel").textContent = s.section;
        $("count").textContent = `${state.slide + 1} / ${slides.length}`;
        $("progress").style.width =
          `${((state.slide + 1) / slides.length) * 100}%`;
        $("prevBtn").disabled = state.slide === 0;
        $("nextBtn").disabled = state.slide === slides.length - 1;
        if (s.after) s.after();
        if (focus) {
          $("main").scrollTop = 0;
          $("main").focus({ preventScroll: true });
        }
        document.title = `${s.title} · Planeación estratégica`;
      }
      function go(n) {
        state.slide = Math.max(0, Math.min(slides.length - 1, n));
        draw(true);
      }
      document.addEventListener("click", (event) => {
        const b = event.target.closest("button");
        if (!b) return;
        const a = b.dataset;
        if (a.go !== undefined) {
          $("menu").close();
          go(+a.go);
        } else if (a.chain !== undefined) {
          state.chain = +a.chain;
          draw();
        } else if (a.case !== undefined) {
          state.case = +a.case;
          draw();
        } else if (a.tool !== undefined) {
          state.tool = +a.tool;
          draw();
        } else if (a.dofa !== undefined) {
          state.dofa = +a.dofa;
          draw();
        } else if (a.scenario !== undefined) {
          state.scenario = +a.scenario;
          draw();
        } else if (a.quiz !== undefined) {
          state.quiz = +a.quiz;
          draw();
        } else if (a.answer !== undefined) {
          state.answers[state.quiz] = +a.answer;
          draw();
        } else if (a.close) {
          $(a.close).close();
        }
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "budget") {
          state.budget = +e.target.value;
          updateBudget();
        }
      });
      $("prevBtn").onclick = () => go(state.slide - 1);
      $("nextBtn").onclick = () => go(state.slide + 1);
      $("menuBtn").onclick = () => {
        $("index").innerHTML = slides
          .map(
            (s, i) =>
              `<button data-go="${i}" ${state.slide === i ? 'aria-current="page"' : ""}><span>${String(i + 1).padStart(2, "0")}</span>${s.title}</button>`,
          )
          .join("");
        $("menu").showModal();
      };
      $("notesBtn").onclick = () => {
        const s = slides[state.slide];
        $("notesBody").innerHTML =
          `<p>${typeof s.notes === "function" ? s.notes() : s.notes}</p>`;
        $("notes").showModal();
      };
      $("motionBtn").onclick = () => {
        const disabled = document.body.classList.toggle("no-motion");
        $("motionBtn").textContent = `Animación: ${disabled ? "no" : "sí"}`;
        $("motionBtn").setAttribute("aria-pressed", String(!disabled));
      };
      $("fullBtn").onclick = async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch (e) {
          $("fullBtn").textContent = "Usa F11 para ampliar";
        }
      };
      document.addEventListener("fullscreenchange", () => {
        $("fullBtn").textContent = document.fullscreenElement
          ? "Salir de pantalla completa"
          : "Pantalla completa";
      });
      document.addEventListener("keydown", (e) => {
        if (
          document.querySelector("dialog[open]") ||
          /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)
        )
          return;
        if (["ArrowRight", "PageDown"].includes(e.key)) {
          e.preventDefault();
          go(state.slide + 1);
        }
        if (["ArrowLeft", "PageUp"].includes(e.key)) {
          e.preventDefault();
          go(state.slide - 1);
        }
        if (e.key === "Home") {
          e.preventDefault();
          go(0);
        }
        if (e.key === "End") {
          e.preventDefault();
          go(slides.length - 1);
        }
      });
      draw();
    </script>
  </body>
</html>
